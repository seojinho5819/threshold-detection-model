window_seconds: 10
sample_rate_hz: 10
time_column: timestamp
raw_signals:
- rpm
- speed
- battery_voltage
- motor_current
- motor_temperature
- hydraulic_pressure
- error_count
features:
- name: rpm_mean
  source: rpm
  agg: mean
- name: rpm_std
  source: rpm
  agg: std
- name: speed_mean
  source: speed
  agg: mean
- name: current_mean
  source: motor_current
  agg: mean
- name: current_std
  source: motor_current
  agg: std
- name: current_max
  source: motor_current
  agg: max
- name: temperature_max
  source: motor_temperature
  agg: max
- name: temperature_mean
  source: motor_temperature
  agg: mean
- name: pressure_mean
  source: hydraulic_pressure
  agg: mean
- name: pressure_std
  source: hydraulic_pressure
  agg: std
- name: battery_mean
  source: battery_voltage
  agg: mean
- name: error_count_sum
  source: error_count
  agg: sum
